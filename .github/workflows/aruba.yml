name: Pubblica su Aruba

# A ogni pubblicazione porta su Aruba le modifiche del repository.
# Su Aruba resta il file .pubblicato con l'ultima versione caricata: se c'è, si caricano solo i file cambiati
# da allora e si tolgono quelli eliminati; se manca (o non torna), si ricopia tutto il sito.
# In entrambi i casi si controlla che ogni file caricato abbia su Aruba la stessa dimensione che ha qui.
# Le credenziali stanno nei segreti dell'organizzazione itaisral (ARUBA_FTP_SERVER,
# ARUBA_FTP_USER, ARUBA_FTP_PASSWORD); finché mancano, la copia viene saltata.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      completa:
        description: "Ricopia tutto il sito"
        type: boolean
        default: false

concurrency:
  group: aruba-itaisral.github.io
  cancel-in-progress: false

jobs:
  aruba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copia su Aruba
        env:
          FTP_SERVER: ${{ secrets.ARUBA_FTP_SERVER }}
          FTP_USER: ${{ secrets.ARUBA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          FTP_RADICE: ${{ vars.ARUBA_FTP_RADICE }}
          COMPLETA: ${{ inputs.completa }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::Credenziali Aruba non ancora impostate: copia saltata."
            exit 0
          fi
          set +e
          { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; } > "$RUNNER_TEMP/apt.log" 2>&1 \
            || { tail -5 "$RUNNER_TEMP/apt.log" | while read -r l; do echo "::error::apt: $l"; done; exit 1; }
          # Il certificato TLS di Aruba è intestato al server FTP reale (es. ftplnx02.aruba.it),
          # non a ftp.italiaisraeleal.it: lo si legge e ci si collega a quel nome, con verifica completa.
          HOST=$(echo | timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" 2>/dev/null \
                 | openssl x509 -noout -subject -nameopt multiline 2>/dev/null | awk -F' = ' '/commonName/{print $2}')
          case "$HOST" in
            *.aruba.it) echo "Server FTP: $HOST" ;;
            *) echo "::error::Certificato FTP inatteso o assente: '$HOST'"; exit 1 ;;
          esac
          DEST="${FTP_RADICE:-/www.italiaisraeleal.it/}"
          DEST="${DEST%/}"
          ESCLUSI='--exclude-glob .git* --exclude ^\.github/ --exclude ^CNAME$ --exclude ^README\.md$ --exclude ^chai/ --exclude ^7ottobre/ --exclude ^video/ --exclude ^.well-known/ --exclude ^\.pubblicato$'
          ESCLUSI_RE='^(\.git|\.github/|CNAME$|README\.md$|chai/|7ottobre/|video/|\.well-known/)'
          # Con TLS 1.3 il server FTP di Aruba tronca alcuni file: si resta su TLS 1.2.
          lftp_aruba() {
            lftp -c "
              set ftp:ssl-force true
              set ftp:ssl-protect-data true
              set ssl:priority NORMAL:-VERS-TLS1.3
              set net:max-retries 3
              set net:timeout 30
              set cmd:fail-exit false
              open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$HOST\"
              $1
            "
          }
          q() { printf '"%s"' "$(printf '%s' "$1" | sed 's/"/\\"/g')"; }

          PRIMA=$(lftp_aruba "cat \"$DEST/.pubblicato\"" 2>/dev/null | tr -dc '0-9a-f' | head -c 40)
          if [ "$COMPLETA" != "true" ] && [ ${#PRIMA} -eq 40 ] && git cat-file -e "$PRIMA^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$PRIMA" HEAD; then
            # ------------------------------------------------ solo le modifiche
            git diff --no-renames --name-only --diff-filter=ACMT "$PRIMA" HEAD | grep -Ev "$ESCLUSI_RE" > "$RUNNER_TEMP/cambiati.txt"
            git diff --no-renames --name-only --diff-filter=D "$PRIMA" HEAD | grep -Ev "$ESCLUSI_RE" > "$RUNNER_TEMP/tolti.txt"
            echo "Ultima versione su Aruba: $PRIMA"
            echo "File cambiati: $(wc -l < "$RUNNER_TEMP/cambiati.txt"), eliminati: $(wc -l < "$RUNNER_TEMP/tolti.txt")"
            carica() {   # $1 = elenco dei file da caricare
              : > "$RUNNER_TEMP/comandi.lftp"
              sed 's#/[^/]*$##;t;s#.*#.#' "$1" | sort -u | while read -r d; do
                [ "$d" = "." ] || echo "mkdir -p -f $(q "$DEST/$d")" >> "$RUNNER_TEMP/comandi.lftp"; done
              while read -r f; do
                d=$(dirname "$f"); echo "put -O $(q "$DEST/$d") $(q "$f")" >> "$RUNNER_TEMP/comandi.lftp"; done < "$1"
              lftp_aruba "$(cat "$RUNNER_TEMP/comandi.lftp")" >> "$RUNNER_TEMP/lftp.log" 2>&1
            }
            controlla() {  # scrive in diversi.txt i file con dimensione diversa (o assenti) su Aruba
              : > "$RUNNER_TEMP/diversi.txt"
              [ -s "$RUNNER_TEMP/cambiati.txt" ] || return
              while read -r f; do echo "du -b $(q "$DEST/$f")"; done < "$RUNNER_TEMP/cambiati.txt" > "$RUNNER_TEMP/cls.lftp"
              lftp_aruba "$(cat "$RUNNER_TEMP/cls.lftp")" > "$RUNNER_TEMP/cls.log" 2>/dev/null
              head -3 "$RUNNER_TEMP/cls.log"
              while read -r f; do
                atteso=$(stat -c %s "$f")
                trovato=$(awk -F'\t' -v p="$DEST/$f" '$2==p {print $1}' "$RUNNER_TEMP/cls.log" | head -1)
                [ "$trovato" = "$atteso" ] || echo "$f" >> "$RUNNER_TEMP/diversi.txt"
              done < "$RUNNER_TEMP/cambiati.txt"
            }
            [ -s "$RUNNER_TEMP/cambiati.txt" ] && carica "$RUNNER_TEMP/cambiati.txt"
            if [ -s "$RUNNER_TEMP/tolti.txt" ]; then
              lftp_aruba "$(while read -r f; do echo "rm -f $(q "$DEST/$f")"; done < "$RUNNER_TEMP/tolti.txt")" >> "$RUNNER_TEMP/lftp.log" 2>&1
            fi
            for giro in 1 2 3; do
              controlla
              diversi=$(wc -l < "$RUNNER_TEMP/diversi.txt")
              [ "$diversi" -eq 0 ] && break
              echo "Giro $giro: $diversi file da ricaricare"; head -20 "$RUNNER_TEMP/diversi.txt"
              carica "$RUNNER_TEMP/diversi.txt"
            done
            if [ "$diversi" -ne 0 ]; then
              echo "::error::Dopo tre tentativi $diversi file su Aruba non coincidono con quelli del repository."
              head -8 "$RUNNER_TEMP/diversi.txt" | while read -r l; do echo "::error::$l"; done
              exit 1
            fi
            RIASSUNTO="$(wc -l < "$RUNNER_TEMP/cambiati.txt") file caricati, $(wc -l < "$RUNNER_TEMP/tolti.txt") rimossi (solo le modifiche)"
          else
            # ------------------------------------------------ tutto il sito
            echo "Nessuna versione precedente utilizzabile su Aruba: si ricopia tutto."
            lftp_aruba "mkdir -p -f \"$DEST\"; mirror --reverse --delete --no-perms --parallel=2 --verbose=1 $ESCLUSI . \"$DEST\"" > "$RUNNER_TEMP/lftp.log" 2>&1
            esito=$?
            tail -40 "$RUNNER_TEMP/lftp.log"
            if [ $esito -ne 0 ]; then
              tail -8 "$RUNNER_TEMP/lftp.log" | while read -r l; do echo "::error::$l"; done
              exit $esito
            fi
            for giro in 1 2 3; do
              lftp_aruba "mirror --reverse --dry-run --ignore-time --no-perms $ESCLUSI . \"$DEST\"" > "$RUNNER_TEMP/diff.log" 2>&1
              diversi=$(grep -c '^put ' "$RUNNER_TEMP/diff.log")
              [ "$diversi" -eq 0 ] && break
              echo "Giro $giro: $diversi file da ricaricare"; grep '^put ' "$RUNNER_TEMP/diff.log" | head -20
              lftp_aruba "mirror --reverse --ignore-time --no-perms --parallel=1 $ESCLUSI . \"$DEST\"" >> "$RUNNER_TEMP/lftp.log" 2>&1
            done
            if [ "$diversi" -ne 0 ]; then
              echo "::error::Dopo tre tentativi $diversi file su Aruba non coincidono con quelli del repository."
              grep '^put ' "$RUNNER_TEMP/diff.log" | head -8 | while read -r l; do echo "::error::$l"; done
              exit 1
            fi
            RIASSUNTO="$(grep -c 'Transferring file' "$RUNNER_TEMP/lftp.log") file caricati, $(grep -c 'Removing old' "$RUNNER_TEMP/lftp.log") rimossi (copia completa)"
          fi
          # segna su Aruba la versione appena pubblicata
          git rev-parse HEAD > "$RUNNER_TEMP/.pubblicato"
          lftp_aruba "put -O \"$DEST\" \"$RUNNER_TEMP/.pubblicato\"" >> "$RUNNER_TEMP/lftp.log" 2>&1
          echo "::notice::Copia su Aruba ($HOST$DEST): $RIASSUNTO."

name: Pubblica su Aruba

# A ogni pubblicazione copia su Aruba i file del repository e toglie quelli eliminati.
# Le credenziali stanno nei segreti dell'organizzazione itaisral (ARUBA_FTP_SERVER,
# ARUBA_FTP_USER, ARUBA_FTP_PASSWORD); finché mancano, la copia viene saltata.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aruba-itaisral.github.io
  cancel-in-progress: false

jobs:
  aruba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copia su Aruba
        env:
          FTP_SERVER: ${{ secrets.ARUBA_FTP_SERVER }}
          FTP_USER: ${{ secrets.ARUBA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          FTP_RADICE: ${{ vars.ARUBA_FTP_RADICE }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::Credenziali Aruba non ancora impostate: copia saltata."
            exit 0
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          DEST="${FTP_RADICE:-/}"
          lftp -c "
            set ftp:ssl-allow true
            set net:max-retries 3
            set net:timeout 30
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"
            mkdir -p -f \"$DEST\"
            mirror --reverse --delete --parallel=4 --verbose=1 \
              --exclude-glob .git* --exclude ^\.github/ --exclude ^CNAME$ --exclude ^README\.md$ --exclude ^chai/ --exclude ^7ottobre/ --exclude ^video/ --exclude ^.well-known/ \
              . \"$DEST\"
          "

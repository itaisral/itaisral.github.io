<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prova tessera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400&family=Frank+Ruhl+Libre:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fbf8f2; font-family: "Titillium Web", sans-serif; color: #1f2023; }
  main { max-width: 440px; margin: 0 auto; padding: 28px 16px 48px; }
  p.nota { font-size: 14px; color: #6b6f76; margin: 0 0 18px; }
  .spazio { container-type: inline-size; margin-bottom: 28px; }
  .carta { position: relative; aspect-ratio: 85.6 / 54; border-radius: 3.7cqw; overflow: hidden; color: #fff;
    background: #11273d url(/soci/tessera-fondo.svg) center / 100% 100% no-repeat; box-shadow: 0 22px 44px rgba(24, 48, 78, .22); }
  .dati { position: absolute; left: 5.84cqw; bottom: 5.84cqw; }
  .dati p { margin: 0; line-height: 1.15; }
  .etichetta { font-size: 2.7cqw; letter-spacing: .2em; text-transform: uppercase; color: #e6a59e; }
  .numero { font-size: 10.5cqw; font-weight: 300; letter-spacing: .04em; line-height: 1.05 !important; }
  .nome { font-size: 4.6cqw; margin-top: .6cqw !important; }
  .qualifica { font-size: 3.3cqw; color: #c9d2de; }
  .qualifica span { font-family: "Frank Ruhl Libre", serif; font-size: 3.9cqw; margin-left: 1.2cqw; color: #f2e3ce; }
  .validita { font-size: 2.9cqw; color: #9fb0c5; margin-top: .6cqw !important; }
  .qr { position: absolute; right: 5.84cqw; bottom: 5.84cqw; width: 25.7cqw; height: 25.7cqw; background: #fff; border-radius: 1.8cqw; padding: 1.8cqw; box-sizing: border-box; }
  .qr svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<main>
  <p class="nota">Pagina di prova. La tessera ha la stessa larghezza che avrà nell’area soci.</p>
  <div class="spazio"><div class="carta">
    <div class="dati">
      <p class="etichetta">Tessera 2027</p>
      <p class="numero">026</p>
      <p class="nome">Mario Rossi</p>
      <p class="qualifica">Socio sostenitore</p>
      <p class="validita">Valida fino al 31 dicembre 2027</p>
    </div>
    <div class="qr" id="qr1"></div>
  </div></div>
  <div class="spazio"><div class="carta">
    <div class="dati">
      <p class="etichetta">Tessera 2027</p>
      <p class="numero">001</p>
      <p class="nome">Emiliano Poggio</p>
      <p class="qualifica">Socio fondatore<span lang="he" dir="rtl">מייסד</span></p>
      <p class="validita">Valida fino al 31 dicembre 2027</p>
    </div>
    <div class="qr" id="qr2"></div>
  </div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  ["qr1", "qr2"].forEach(function (id) {
    var q = qrcode(0, "M"); q.addData("https://italiaisraeleal.it/soci/verifica/#prova-" + id); q.make();
    document.getElementById(id).innerHTML = q.createSvgTag({ scalable: true, margin: 0 });
  });
</script>
</body>
</html>
